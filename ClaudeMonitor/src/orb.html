<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    width: 100%; height: 100%;
    -webkit-user-select: none; user-select: none; cursor: default;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  }
  #pills {
    position: absolute; top: 3px; left: calc(50% - 75px); width: 150px;
    display: flex; justify-content: center; gap: 4px;
  }
  .pill {
    min-width: 58px; height: 20px; box-sizing: border-box; padding: 0 6px;
    border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 3px;
    font: 600 11px "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .2px; white-space: nowrap;
    color: #7dffb8; background: rgba(8, 12, 20, .80);
    border: 1px solid rgba(125, 255, 184, .45);
    box-shadow: 0 0 6px rgba(125, 255, 184, .25);
    transition: color .6s, border-color .6s, box-shadow .6s, opacity .4s;
  }
  .pill .ic { font-size: 10px; opacity: .85; }
  .pill.hover { font-size: 10.5px; }
  .stale .pill { opacity: .55; }
  canvas { position: absolute; top: 27px; left: calc(50% - 70px); width: 140px; height: 140px; }

  /* ---- chat activity cards ---- */
  #tasks {
    position: absolute; top: 180px; left: calc(50% - 116px); width: 232px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .task {
    --c: 255, 210, 63;
    position: relative; height: 44px; box-sizing: border-box; padding: 0 6px 0 10px;
    display: flex; align-items: center; gap: 9px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, rgba(16,22,34,.92), rgba(8,12,20,.92));
    border: 1px solid rgba(var(--c), .45);
    box-shadow: 0 0 10px rgba(var(--c), .22), inset 0 0 12px rgba(var(--c), .06);
    cursor: pointer;
  }
  .task.permission { --c: 86, 170, 255; }
  .task.done { --c: 62, 240, 138; }
  .task::after {             /* thin scanning sheen while working */
    content: ''; position: absolute; top: 0; bottom: 0; width: 40px; left: -40px;
    background: linear-gradient(90deg, transparent, rgba(var(--c), .16), transparent);
    animation: sweep 2.4s linear infinite;
  }
  .task.done::after { display: none; }
  @keyframes sweep { to { left: 100%; } }
  .dot {
    flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%;
    background: rgb(var(--c)); box-shadow: 0 0 8px rgb(var(--c));
    animation: pulse 1.4s ease-in-out infinite;
  }
  .task.permission .dot { animation-duration: .7s; }
  .task.done .dot { animation: none; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.75); } }
  .txt { flex: 1 1 auto; min-width: 0; line-height: 1.25; }
  .t1 { font: 600 11.5px -apple-system, "PingFang SC", sans-serif; color: #f2f6ff;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t2 { font: 500 10px "SF Mono", ui-monospace, Menlo, monospace; color: rgb(var(--c));
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    flex: 0 0 auto; height: 26px; padding: 0 8px; border-radius: 13px; box-sizing: border-box;
    display: flex; align-items: center; gap: 4px;
    font: 700 10.5px -apple-system, sans-serif; color: #04140a; background: rgb(var(--c));
    box-shadow: 0 0 8px rgba(var(--c), .6);
  }
  .go { flex: 0 0 auto; font: 600 14px -apple-system, sans-serif; color: rgba(var(--c), .9); padding: 0 4px; }
  #more { font: 500 10px -apple-system, sans-serif; color: rgba(220,230,255,.65); text-align: center; height: 12px; }
</style>
</head>
<body>
<div id="pills">
  <div class="pill" id="pS"><span class="ic">↻</span><span class="tx">--</span></div>
  <div class="pill" id="pW"><span class="ic">↻</span><span class="tx">--</span></div>
</div>
<canvas id="orb"></canvas>
<div id="tasks"></div>
<script>
(() => {
  const cv = document.getElementById('orb');
  const ctx = cv.getContext('2d');
  const W = 140, H = 140, CX = 70, CY = 70, R = 58;
  let zoom = 1;

  function setupCanvas() {
    const dpr = Math.min(6, Math.max(window.devicePixelRatio || 1, 2 * zoom));
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setupCanvas();
  window.addEventListener('resize', setupCanvas);

  const mk = () => ({ target: 0, shown: 0, reset: null, has: false, bubbles: [] });
  const S = { session: mk(), week: mk(), status: 'loading', stale: false, hover: false };

  // ---------- colour: green -> yellow -> red as usage grows ----------
  const STOPS = [[0, 150], [40, 128], [55, 88], [70, 52], [85, 24], [100, 0]];
  function hue(p) {
    p = Math.max(0, Math.min(100, p));
    for (let i = 1; i < STOPS.length; i++) {
      if (p <= STOPS[i][0]) {
        const [p0, h0] = STOPS[i - 1], [p1, h1] = STOPS[i];
        return h0 + (h1 - h0) * (p - p0) / (p1 - p0);
      }
    }
    return 0;
  }

  // ---------- data from the native side ----------
  function parseTime(s) {
    if (!s) return null;
    s = String(s).replace(/(\.\d{3})\d+/, '$1');
    const t = Date.parse(s);
    return isNaN(t) ? null : t;
  }
  function setWin(o, w) {
    o.has = true;
    if (!w) { o.target = 0; o.reset = null; return; }
    const v = Number(w.pct);
    o.target = isFinite(v) ? Math.max(0, Math.min(100, v)) : 0;
    o.reset = parseTime(w.resetsAt);
  }
  window.orbUpdate = function (p) {
    if (!p) return;
    if (p.status === 'ok') {
      setWin(S.session, p.session); setWin(S.week, p.week);
      S.status = 'ok'; S.stale = false;
    } else if (p.status === 'login') {
      S.status = 'login';
    } else if (p.status === 'error') {
      S.stale = true;
      if (!S.session.has) S.status = 'error';
    }
    document.body.classList.toggle('stale', S.stale || S.status !== 'ok');
    renderPills();
  };
  window.orbHover = function (h) { S.hover = !!h; renderPills(); };
  window.orbZoom = function (z) { zoom = z || 1; setupCanvas(); };

  // ---------- countdown pills ----------
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const pad = n => String(n).padStart(2, '0');
  function fmtHours(t) {
    if (t == null) return '--';
    const h = Math.max(0, (t - Date.now()) / 3600000);
    return h < 10 ? h.toFixed(1) + 'h' : Math.round(h) + 'h';
  }
  function fmtClock(t, day) {
    if (t == null) return '--';
    const d = new Date(t);
    const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    return day ? DAYS[d.getDay()] + ' ' + hm : hm;
  }
  function stylePill(el, o) {
    const h = hue(o.target);
    el.style.color = `hsl(${h},95%,68%)`;
    el.style.borderColor = `hsla(${h},95%,60%,.5)`;
    el.style.boxShadow = `0 0 7px hsla(${h},95%,55%,.30)`;
  }
  function renderPills() {
    const ps = document.getElementById('pS'), pw = document.getElementById('pW');
    const ok = S.status === 'ok';
    ps.querySelector('.tx').textContent = ok ? (S.hover ? fmtClock(S.session.reset, false) : fmtHours(S.session.reset)) : '--';
    pw.querySelector('.tx').textContent = ok ? (S.hover ? fmtClock(S.week.reset, true) : fmtHours(S.week.reset)) : '--';
    ps.classList.toggle('hover', S.hover); pw.classList.toggle('hover', S.hover);
    stylePill(ps, S.session); stylePill(pw, S.week);
  }
  setInterval(renderPills, 15000);
  renderPills();

  // ---------- drawing ----------
  function circlePath(r) { ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); }

  function wavePath(x0, x1, level, amp, k, phase) {
    ctx.moveTo(x0 - 2, level);
    for (let x = x0 - 2; x <= x1 + 2; x += 2) {
      const y = level + amp * Math.sin(k * x + phase) + amp * 0.35 * Math.sin(k * 2.3 * x - phase * 1.4);
      ctx.lineTo(x, y);
    }
  }

  function drawBubbles(o, side, level, h, dt) {
    const x0 = side < 0 ? CX - R + 6 : CX + 4, x1 = side < 0 ? CX - 4 : CX + R - 6;
    const n = o.shown > 4 ? 7 : 0;
    while (o.bubbles.length < n) o.bubbles.push(newBubble(x0, x1, true));
    if (n === 0) o.bubbles.length = 0;
    for (const b of o.bubbles) {
      b.y -= b.v * dt; b.ph += dt * 3;
      const x = b.x + Math.sin(b.ph) * 1.4;
      if (b.y < level + 3) Object.assign(b, newBubble(x0, x1, false));
      ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${h},100%,90%,.18)`; ctx.fill();
      ctx.lineWidth = 0.7; ctx.strokeStyle = `hsla(${h},100%,92%,.55)`; ctx.stroke();
    }
  }
  function newBubble(x0, x1, anywhere) {
    return {
      x: x0 + Math.random() * (x1 - x0),
      y: anywhere ? CY + R - Math.random() * R : CY + R + Math.random() * 8,
      r: 0.8 + Math.random() * 1.8, v: 6 + Math.random() * 12, ph: Math.random() * 6
    };
  }

  function drawLiquid(side, o, t, dt) {
    const p = o.shown;
    if (p <= 0.2) return;
    const h = hue(p);
    ctx.save();
    circlePath(R - 0.5); ctx.clip();
    ctx.beginPath();
    if (side < 0) ctx.rect(CX - R - 2, CY - R - 2, R + 2 - 0.8, 2 * R + 4);
    else ctx.rect(CX + 0.8, CY - R - 2, R + 2, 2 * R + 4);
    ctx.clip();

    const level = CY + R - (p / 100) * 2 * R;
    const amp = 3.2 * Math.max(0, Math.min(1, p / 6, (100 - p) / 6));
    const x0 = side < 0 ? CX - R : CX, x1 = side < 0 ? CX : CX + R;
    const sp = side < 0 ? 1 : 1.22, ph = side < 0 ? 0 : 2.1;

    // back wave
    ctx.beginPath(); wavePath(x0, x1, level - 1.5, amp * 0.9, 0.11, -t * 1.7 * sp + ph + 1.7);
    ctx.lineTo(x1 + 2, CY + R + 2); ctx.lineTo(x0 - 2, CY + R + 2); ctx.closePath();
    ctx.fillStyle = `hsla(${h},90%,48%,.42)`; ctx.fill();

    // front wave
    const g = ctx.createLinearGradient(0, level - amp, 0, CY + R);
    g.addColorStop(0, `hsla(${h},95%,60%,.95)`);
    g.addColorStop(0.55, `hsla(${h + 6},90%,42%,.95)`);
    g.addColorStop(1, `hsla(${h + 12},90%,24%,.97)`);
    const phase = t * 2.1 * sp + ph;
    ctx.beginPath(); wavePath(x0, x1, level, amp, 0.085, phase);
    ctx.lineTo(x1 + 2, CY + R + 2); ctx.lineTo(x0 - 2, CY + R + 2); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();

    // moving sheen inside the liquid
    const sx = (side < 0 ? CX - R : CX) + ((t * 14 * sp) % (R + 40)) - 20;
    const sg = ctx.createLinearGradient(sx - 10, 0, sx + 10, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.07)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fill();

    drawBubbles(o, side, level, h, dt);

    // glowing surface line
    ctx.beginPath(); wavePath(x0, x1, level, amp, 0.085, phase);
    ctx.shadowColor = `hsla(${h},100%,65%,.9)`; ctx.shadowBlur = 6;
    ctx.strokeStyle = `hsla(${h},100%,82%,.95)`; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.restore();
  }

  function drawShell(t) {
    const hL = hue(S.session.shown), hR = hue(S.week.shown);
    const live = S.status === 'ok';
    // neon rim, one colour per half
    for (const [a0, a1, h] of [[Math.PI / 2, Math.PI * 1.5, hL], [-Math.PI / 2, Math.PI / 2, hR]]) {
      ctx.save();
      ctx.shadowColor = live ? `hsla(${h},100%,55%,.9)` : 'rgba(150,170,200,.5)';
      ctx.shadowBlur = 9 + 3 * Math.sin(t * 2);
      ctx.strokeStyle = live ? `hsla(${h},100%,62%,.9)` : 'rgba(160,180,210,.6)';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(CX, CY, R + 0.5, a0, a1); ctx.stroke();
      ctx.restore();
    }
    // body
    const g = ctx.createRadialGradient(CX - R * .3, CY - R * .35, R * .1, CX, CY, R);
    g.addColorStop(0, 'rgba(32,44,68,.94)'); g.addColorStop(1, 'rgba(6,9,16,.96)');
    circlePath(R); ctx.fillStyle = g; ctx.fill();
    // dot grid
    ctx.save(); circlePath(R - 1); ctx.clip();
    ctx.fillStyle = 'rgba(150,190,255,.08)';
    for (let y = CY - R; y < CY + R; y += 7) for (let x = CX - R; x < CX + R; x += 7) ctx.fillRect(x, y, 1, 1);
    ctx.restore();
    // HUD ring: ticks + rotating scanner arc
    ctx.save();
    ctx.strokeStyle = 'rgba(190,215,255,.16)'; ctx.lineWidth = 1;
    for (let i = 0; i < 60; i++) {
      const a = i / 60 * Math.PI * 2, r0 = R + 4, r1 = R + (i % 5 === 0 ? 7 : 5.5);
      ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0);
      ctx.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1); ctx.stroke();
    }
    const a = t * 0.9;
    ctx.strokeStyle = 'rgba(220,240,255,.55)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(CX, CY, R + 4, a, a + 0.55); ctx.stroke();
    ctx.beginPath(); ctx.arc(CX, CY, R + 4, a + Math.PI, a + Math.PI + 0.3); ctx.stroke();
    ctx.restore();
  }

  function drawGlass() {
    ctx.save(); circlePath(R); ctx.clip();
    // divider
    const dg = ctx.createLinearGradient(0, CY - R, 0, CY + R);
    dg.addColorStop(0, 'rgba(230,240,255,0)'); dg.addColorStop(.5, 'rgba(230,240,255,.45)'); dg.addColorStop(1, 'rgba(230,240,255,0)');
    ctx.fillStyle = dg; ctx.fillRect(CX - 0.6, CY - R, 1.2, 2 * R);
    ctx.fillStyle = 'rgba(230,240,255,.35)';
    for (const q of [.25, .5, .75]) { const y = CY + R - q * 2 * R; ctx.fillRect(CX - 3.5, y - .5, 7, 1); }
    // highlights
    const hg = ctx.createLinearGradient(0, CY - R, 0, CY - R * .25);
    hg.addColorStop(0, 'rgba(255,255,255,.30)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.ellipse(CX, CY - R * .58, R * .62, R * .34, 0, 0, Math.PI * 2);
    ctx.fillStyle = hg; ctx.fill();
    const bg = ctx.createRadialGradient(CX, CY + R * 1.05, R * .2, CX, CY + R * 1.05, R * .75);
    bg.addColorStop(0, 'rgba(255,255,255,.10)'); bg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = bg; ctx.fillRect(CX - R, CY, 2 * R, R);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1;
    circlePath(R - 1); ctx.stroke();
  }

  function drawLabel(side, o, caption) {
    const x = CX + side * R * 0.47;
    const val = String(Math.round(o.shown));
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 0.5;
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.font = '700 19px -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif';
    const wn = ctx.measureText(val).width;
    ctx.font = '700 10px -apple-system, "SF Pro Display", sans-serif';
    const wp = ctx.measureText('%').width;
    const sx = x - (wn + wp + 1) / 2;
    ctx.font = '700 19px -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif';
    ctx.fillText(val, sx, CY + 5);
    ctx.font = '700 10px -apple-system, "SF Pro Display", sans-serif';
    ctx.fillText('%', sx + wn + 1, CY + 5);
    ctx.font = '600 8px -apple-system, "SF Pro Text", sans-serif'; ctx.letterSpacing = '0.8px';
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.78)';
    ctx.fillText(caption, x, CY + 19);
    ctx.restore();
  }

  function drawCenterText(lines, t) {
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 4;
    ctx.fillStyle = `rgba(235,242,255,${0.65 + 0.25 * Math.sin(t * 3)})`;
    ctx.font = '600 11px -apple-system, "PingFang SC", sans-serif';
    lines.forEach((l, i) => ctx.fillText(l, CX, CY - (lines.length - 1) * 7 + i * 14));
    ctx.restore();
  }

  let lastT = 0, lastDraw = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (ts - lastDraw < 32) return;           // ~30 fps is plenty and saves battery
    lastDraw = ts;
    const t = ts / 1000, dt = Math.min(0.1, lastT ? t - lastT : 0.03); lastT = t;
    for (const o of [S.session, S.week]) {
      const tgt = S.status === 'ok' ? o.target : 0;
      o.shown += (tgt - o.shown) * Math.min(1, dt * 2.2);
      if (Math.abs(tgt - o.shown) < 0.05) o.shown = tgt;
    }
    ctx.clearRect(0, 0, W, H);
    drawShell(t);
    drawLiquid(-1, S.session, t, dt);
    drawLiquid(1, S.week, t + 0.37, dt);
    drawGlass();
    if (S.status === 'ok') {
      drawLabel(-1, S.session, 'SESSION');
      drawLabel(1, S.week, 'WEEK');
      if (S.stale) { ctx.fillStyle = 'rgba(255,190,80,.9)'; ctx.beginPath(); ctx.arc(CX, CY + R - 9, 2, 0, Math.PI * 2); ctx.fill(); }
    } else if (S.status === 'login') {
      drawCenterText(['Double-click', 'to sign in'], t);
    } else if (S.status === 'error') {
      drawCenterText(['Offline', 'double-click to retry'], t);
    } else {
      drawCenterText(['Loading…'], t);
    }
  }
  requestAnimationFrame(frame);

  // ---------- chat activity cards ----------
  const MAX = 5;
  let TASKS = [];
  const clock = (ms) => {
    const d = new Date(ms), n = new Date();
    const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    return d.toDateString() === n.toDateString() ? hm : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
  };
  const dur = (ms, short) => {
    const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    if (h) return `${h}h ${pad(m)}m`;
    if (m) return short ? `${m}m` : `${m}m ${pad(sec)}s`;
    return `${sec}s`;
  };
  const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function line2(t) {
    const now = Date.now();
    if (t.state === 'running') return `Since ${clock(t.startedAt)} · ${dur(now - t.startedAt)}`;
    if (t.state === 'permission') return `Waiting for you · ${dur(now - t.startedAt, true)}`;
    const end = t.endedAt || now;
    return `Done ${clock(end)} · ${dur(end - t.startedAt, true)}`;
  }
  function renderTasks() {
    const box = document.getElementById('tasks');
    const order = { permission: 0, done: 1, running: 2 };
    const list = TASKS.slice().sort((a, b) => (order[a.state] - order[b.state]) || (b.startedAt - a.startedAt));
    box.innerHTML = list.slice(0, MAX).map(t => `
      <div class="task ${t.state}" data-id="${esc(t.id)}">
        <div class="dot"></div>
        <div class="txt"><div class="t1">${esc(t.title)}</div><div class="t2" data-l2="${esc(t.id)}">${esc(line2(t))}</div></div>
        ${t.state === 'done' ? '<div class="btn">✓ Check</div>' : t.state === 'permission' ? '<div class="btn">⚑ Allow</div>' : '<div class="go">›</div>'}
      </div>`).join('') + (list.length > MAX ? `<div id="more">+${list.length - MAX} more</div>` : '');
  }
  function tick() {
    for (const t of TASKS) {
      const el = document.querySelector(`[data-l2="${CSS.escape(t.id)}"]`);
      if (el) el.textContent = line2(t);
    }
  }
  setInterval(tick, 1000);
  window.orbTasks = function (list) { TASKS = Array.isArray(list) ? list : []; renderTasks(); };
  window.orbClickAt = function (x, y) {
    const el = document.elementFromPoint(x, y);
    const card = el && el.closest('.task');
    if (!card) return null;
    const btn = !!el.closest('.btn');
    return JSON.stringify({ id: card.dataset.id, action: btn && card.classList.contains('done') ? 'check' : btn ? 'permit' : 'open' });
  };
})();
</script>
</body>
</html>
